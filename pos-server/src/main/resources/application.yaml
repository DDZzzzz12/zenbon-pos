# Ktor Server Configuration
ktor:
  # Application deployment configuration
  deployment:
    # Server port configuration
    port: 8080
    # Host binding configuration
    host: ${HOST:0.0.0.0}  # Override with environment variable

# Database Configuration
database:
  # Connection mode: "embedded" (bundled PG, no install required) or "external" (separate PG server, e.g. Docker)
  mode: ${DATABASE_MODE:embedded}

  # Embedded PostgreSQL Configuration (used when mode=embedded)
  embedded:
    port: ${EMBEDDED_PG_PORT:5436}
    dataDirectory: ${EMBEDDED_PG_DATA_DIR:}  # Empty = platform default (~/POS Server/data/postgresql/)
    databaseName: ${EMBEDDED_PG_DATABASE:pos_db}
    username: ${EMBEDDED_PG_USERNAME:pos}
    password: ${EMBEDDED_PG_PASSWORD:pos}

  # External PostgreSQL Configuration (used when mode=external)
  postgresql:
    # JDBC Configuration
    driver: "org.postgresql.Driver"
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pos_db}  # Override with environment variable

    # Authentication Configuration
    username: ${DATABASE_USERNAME:pos}  # Override with environment variable
    password: ${DATABASE_PASSWORD:pos}  # Override with environment variable

    # Connection Pool Configuration
    maximumPoolSize: ${DATABASE_MAX_POOL_SIZE:10}  # Override with environment variable

    # Transaction Configuration
    isAutoCommit: false

    # Timeout Configuration (in milliseconds)
    connectionTimeout: 300000   # 30 seconds
    idleTimeout: 600000        # 10 minutes
    maxLifetime: 1000000        # 16.67 minutes

# Security Configuration
security:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production}  # Override with environment variable
    issuer: ${JWT_ISSUER:pos-system}  # Override with environment variable
    audience: ${JWT_AUDIENCE:pos-users}  # Override with environment variable
    realm: ${JWT_REALM:POS System}  # Override with environment variable

    # Token expiration times
    accessTokenExpiryHours: ${JWT_ACCESS_TOKEN_EXPIRY_HOURS:8}  # Override with environment variable (unused, kept for reference)
    accessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}  # Override with environment variable
    refreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:30}  # Override with environment variable

    # Development mode - bypass JWT authentication
    developmentMode: ${JWT_DEVELOPMENT_MODE:false}  # Override with environment variable

# API documentation
api:
  docs:
    # Unset = the Web-Admin switch decides (default off). true/false forces it and locks the switch.
    enabled: "$?POS_API_DOCS"

# Maintainer account: log search and, later, other maintenance APIs. OFF unless BOTH values are set.
# Create the hash with:  java -jar pos-server.jar --hash-maintainer-password
# Put it in the environment single-quoted - a BCrypt hash contains '$'.
maintenance:
  username: ${MAINTAINER_USERNAME:}
  passwordHash: ${MAINTAINER_PASSWORD_HASH:}
  sessionMinutes: ${MAINTAINER_SESSION_MINUTES:30}
