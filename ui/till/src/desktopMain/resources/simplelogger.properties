# SLF4J Simple Logger configuration
# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=debug

# Log format: show date, thread, logger name, level
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# Silence noisy third-party libraries (PDFBox/FontBox glyph-substitution debug spam, etc.)
org.slf4j.simpleLogger.log.org.apache.pdfbox=warn
org.slf4j.simpleLogger.log.org.apache.fontbox=warn
