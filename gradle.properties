#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Compose Desktop
# Keep in sync with app.version below
compose.desktop.application.nativeDistributions.packageBuildVersion=1.2.0
compose.desktop.verbose=false

#App Metadata - Single source of truth for all modules
app.version=1.2.1
app.versionCode=16
app.name=Zenbon POS
app.packageName=zenbon-pos
app.description=Modern Point of Sale System
app.vendor=Your Company Name
app.email=your-email@example.com
app.icon=src/desktopMain/resources/icon.ico
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
